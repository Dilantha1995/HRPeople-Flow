<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeopleFlow HR — Human Resource Management</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.0/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ═══════════════════════════════════════════
   PEOPLEFLOW HR v1.0 — STAKEHOLDER PROTOTYPE
   Designed to integrate with PayFlow Pro
   ═══════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f9;--surface:#fff;--s2:#f0f2f6;--s3:#e8ebf0;
  --border:#dde1e8;--border2:#c8cdd8;
  --text:#1c2030;--t2:#5c6478;--t3:#9ba3b5;
  --blue:#1849a9;--blue2:#eef2fc;--blue3:#0d2d6e;
  --green:#166534;--green2:#f0fdf4;--green3:#dcfce7;
  --amber:#92400e;--amber2:#fffbeb;
  --red:#991b1b;--red2:#fef2f2;--red3:#fee2e2;
  --teal:#115e59;--teal2:#f0fdfa;
  --orange:#c2410c;--orange2:#fff7ed;
  --purple:#6b21a8;--purple2:#faf5ff;
  --r:8px;--r2:12px;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5}

/* ── LOGIN SCREEN ── */
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,var(--blue3) 0%,#1849a9 60%,#1e6fa0 100%);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;overflow-y:auto}
.login-box{background:#fff;border-radius:16px;padding:36px;width:440px;max-width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3);margin:auto}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo .logo-mark{width:56px;height:56px;background:var(--blue3);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;margin-bottom:12px;letter-spacing:.02em}
.login-logo h1{font-size:22px;font-weight:800;color:var(--blue3)}
.login-logo p{font-size:13px;color:var(--t2);margin-top:3px}
.login-field{margin-bottom:14px}
.login-label{display:block;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.login-input{width:100%;padding:11px 14px;border:1.5px solid var(--border2);border-radius:var(--r);font-size:13px;color:var(--text);outline:none;transition:border-color .15s}
.login-input:focus{border-color:var(--blue)}
.login-btn{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .15s}
.login-btn:hover{background:var(--blue3)}
.login-demo{margin-top:18px;padding:12px;background:var(--s2);border-radius:var(--r);font-size:12px;max-height:280px;overflow-y:auto}
.login-demo-title{font-weight:700;color:var(--text);margin-bottom:8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.demo-user{display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:4px;padding:5px 8px;transition:background .1s}
.demo-user:hover{background:var(--border)}
.demo-user .du-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.demo-user .du-info{flex:1}
.demo-user .du-name{font-weight:600;font-size:12px}
.demo-user .du-role{font-size:10px;color:var(--t2)}
.login-error{background:var(--red2);color:var(--red);border-radius:var(--r);padding:10px 14px;font-size:12px;margin-bottom:12px;display:none}
.login-link{text-align:center;font-size:11px;color:var(--t2);margin-top:14px}
.login-link a{color:var(--blue);text-decoration:none;font-weight:600;cursor:pointer}

/* ── TOPBAR ── */
.topbar{background:var(--blue3);display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:50px;position:sticky;top:0;z-index:60;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.logo{display:flex;align-items:center;gap:10px}
.logo-box{width:30px;height:30px;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--blue3);overflow:hidden;flex-shrink:0}
.logo-text{color:#fff;font-size:15px;font-weight:700}
.logo-sub{color:rgba(255,255,255,.4);font-size:10px;margin-left:6px}
.topbar-right{display:flex;align-items:center;gap:10px}
.urg-bell{position:relative;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:6px 10px;cursor:pointer;color:#fff;font-size:15px}
.urg-count{position:absolute;top:-5px;right:-5px;width:17px;height:17px;background:#ef4444;border-radius:50%;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff;border:2px solid var(--blue3)}
.pkg-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;color:#fff}
.user-pill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:4px 12px 4px 4px;cursor:pointer}
.user-av{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;background-size:cover;background-position:center}
.user-nm{color:#fff;font-size:12px;font-weight:500}
.logout-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:5px 10px;color:#fff;font-size:11px;cursor:pointer}

/* ── PUNCH BAR (sign-in/sign-out) ── */
.punch-bar{background:linear-gradient(135deg,#0d2d6e,#1849a9);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.punch-status{display:flex;align-items:center;gap:10px;flex:1;min-width:240px}
.punch-status-dot{width:12px;height:12px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.25);flex-shrink:0}
.punch-status-dot.out{background:#94a3b8;box-shadow:0 0 0 4px rgba(148,163,184,.25)}
.punch-status-text{flex:1}
.punch-status-text .ps-lbl{font-size:10px;opacity:.7;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.punch-status-text .ps-val{font-size:14px;font-weight:700}
.punch-time{font-family:'Courier New',monospace;font-size:18px;font-weight:800;letter-spacing:.04em;background:rgba(255,255,255,.1);padding:6px 14px;border-radius:var(--r)}
.punch-loc{font-size:11px;opacity:.75;display:flex;align-items:center;gap:4px}
.punch-btn{padding:10px 22px;border-radius:var(--r);border:none;font-weight:800;font-size:13px;cursor:pointer;transition:all .15s}
.punch-btn.in{background:#22c55e;color:#fff}
.punch-btn.in:hover{background:#16a34a}
.punch-btn.out{background:#ef4444;color:#fff}
.punch-btn.out:hover{background:#dc2626}
.punch-btn.disabled{opacity:.4;cursor:not-allowed}

/* ── LAYOUT ── */
.app-body{display:grid;grid-template-columns:215px 1fr;min-height:calc(100vh - 50px)}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:10px 0;overflow-y:auto}
.nav-sec{font-size:9px;font-weight:800;color:var(--t3);padding:12px 15px 3px;text-transform:uppercase;letter-spacing:.09em}
.ni{display:flex;align-items:center;gap:9px;padding:8px 15px;font-size:12px;color:var(--t2);cursor:pointer;border-left:3px solid transparent;transition:all .12s;user-select:none}
.ni:hover{background:var(--s2);color:var(--text)}
.ni.active{background:var(--blue2);color:var(--blue);border-left-color:var(--blue);font-weight:600}
.ni .ic{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.nbadge{margin-left:auto;border-radius:20px;font-size:9px;font-weight:800;padding:2px 7px;min-width:18px;text-align:center;color:#fff;background:var(--red)}
.nbadge.a{background:#d97706}.nbadge.g{background:var(--green)}.nbadge.b{background:var(--blue)}

/* ── MAIN ── */
.main{padding:22px;overflow-y:auto;background:var(--bg)}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.pt{font-size:19px;font-weight:700;color:var(--text)}
.ps{font-size:12px;color:var(--t2);margin-top:3px}
.brow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;font-weight:500;transition:all .12s;white-space:nowrap;line-height:1.4;font-family:inherit}
.btn:hover{background:var(--s2)}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue)}.btn-p:hover{background:var(--blue3)}
.btn-g{background:var(--green);color:#fff;border-color:var(--green)}.btn-g:hover{background:#14532d}
.btn-r{background:var(--red);color:#fff;border-color:var(--red)}.btn-r:hover{background:#7f1d1d}
.btn-o{background:var(--orange);color:#fff;border-color:var(--orange)}.btn-o:hover{background:#9a3412}
.btn-sm{padding:5px 12px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:10px;border-radius:6px}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:16px}
.ch{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ct{font-size:13px;font-weight:700;color:var(--text)}
.cs{font-size:11px;color:var(--t2);margin-top:2px}
.cb{padding:18px}
.cb.flush{padding:0}

/* ── STATS ── */
.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.sgrid.g4{grid-template-columns:repeat(4,1fr)}
.sgrid.g3{grid-template-columns:repeat(3,1fr)}
.sgrid.g6{grid-template-columns:repeat(6,1fr)}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.sc.bl::before{background:var(--blue)}.sc.gr::before{background:var(--green)}
.sc.am::before{background:#d97706}.sc.te::before{background:var(--teal)}
.sc.or::before{background:var(--orange)}.sc.pu::before{background:var(--purple)}
.sc.rd::before{background:var(--red)}
.sl{font-size:10px;font-weight:600;color:var(--t2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.sv{font-size:24px;font-weight:800;color:var(--text);line-height:1}
.ss{font-size:10px;color:var(--t3);margin-top:5px}
.si{position:absolute;right:12px;top:14px;font-size:22px;opacity:.12}

/* ── ALERTS ── */
.al{border-radius:var(--r);padding:11px 15px;font-size:12px;margin-bottom:12px;border-left:3px solid;line-height:1.6}
.al-i{background:var(--blue2);color:var(--blue);border-color:var(--blue)}
.al-s{background:var(--green2);color:var(--green);border-color:var(--green)}
.al-w{background:var(--amber2);color:var(--amber);border-color:#d97706}
.al-r{background:var(--red2);color:var(--red);border-color:var(--red)}
.al-o{background:var(--orange2);color:var(--orange);border-color:var(--orange)}

/* ── BADGES ── */
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.bd{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.b-draft{background:var(--s3);color:var(--t2)}
.b-sub{background:#dbeafe;color:#1e40af}
.b-chk{background:#e0e7ff;color:#3730a3}
.b-pap{background:#fef3c7;color:#92400e}
.b-app{background:var(--teal2);color:var(--teal)}
.b-paid{background:var(--green3);color:var(--green)}
.b-rej{background:var(--red3);color:var(--red)}
.b-urg{background:var(--orange2);color:var(--orange);border:1px solid #fed7aa}
.b-active{background:var(--green3);color:var(--green)}
.b-inactive{background:var(--s3);color:var(--t2)}
.etag{font-size:9px;font-weight:800;padding:2px 7px;border-radius:4px;letter-spacing:.04em}
.e-PSMS{background:#dbeafe;color:#1e40af}.e-PPM{background:#ccfbf1;color:#115e59}
.e-MDX{background:#fef3c7;color:#92400e}.e-SCC{background:#dcfce7;color:#166534}

/* ── TABLES ── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;font-weight:700;color:var(--t3);padding:9px 13px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;background:var(--s2)}
td{padding:10px 13px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--s2)}
.mono{font-family:'Courier New',monospace;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--blue3)}

/* ── FORMS ── */
.fg{margin-bottom:13px}
.fl{display:block;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px}
.req{color:var(--red);margin-left:2px}
.fi,.fs,.fta{width:100%;font-size:12px;padding:8px 11px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);color:var(--text);outline:none;transition:border-color .12s;font-family:inherit}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,73,169,.08)}
.fta{resize:vertical;min-height:64px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fsec{font-size:10px;font-weight:800;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;padding-bottom:9px;border-bottom:1px solid var(--border);margin:16px 0 13px}

/* ── ENTITY BAR ── */
.ebar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.ebt{padding:5px 13px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--t2);cursor:pointer;transition:all .12s}
.ebt:hover{border-color:var(--blue);color:var(--blue)}
.ebt.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ── TABS ── */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 18px;font-size:12px;font-weight:500;color:var(--t2);border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px;white-space:nowrap;transition:all .12s;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit}
.tab:hover{color:var(--text)}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}

/* ── MODAL ── */
.mbd{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--r2);width:720px;max-width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal.lg{width:980px}
.modal.sm{width:480px}
.mh{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:5}
.mt{font-size:15px;font-weight:800;color:var(--text)}
.mc{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:none;cursor:pointer;font-size:16px;color:var(--t2);display:flex;align-items:center;justify-content:center}
.mc:hover{background:var(--s2)}
.mb{padding:20px 22px}
.mf{padding:13px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface)}

/* ── EMPLOYEE CARDS / DIRECTORY ── */
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.emp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:16px;text-align:center;cursor:pointer;transition:all .15s}
.emp-card:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(24,73,169,.08)}
.emp-avatar{width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;margin:0 auto 10px;background-size:cover;background-position:center}
.emp-avatar.lg{width:84px;height:84px;font-size:26px}
.emp-avatar.sm{width:36px;height:36px;font-size:13px}
.emp-avatar.xs{width:28px;height:28px;font-size:11px}
.emp-name{font-size:13px;font-weight:700;color:var(--text)}
.emp-pos{font-size:11px;color:var(--t2);margin-top:2px}
.emp-reg{font-family:'Courier New',monospace;font-size:10px;color:var(--t3);margin-top:4px;font-weight:700}
.emp-meta{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;flex-wrap:wrap}

/* ── ORG CHART ── */
.org-tree{display:flex;flex-direction:column;align-items:center;padding:20px 10px}
.org-node{background:var(--surface);border:2px solid var(--border);border-radius:var(--r2);padding:10px 14px;text-align:center;min-width:160px;box-shadow:0 2px 6px rgba(0,0,0,.04);position:relative}
.org-node.lvl-1{border-color:var(--blue3);background:var(--blue2)}
.org-node.lvl-2{border-color:var(--blue)}
.org-node.lvl-3{border-color:var(--teal)}
.org-name{font-size:12px;font-weight:700;color:var(--text)}
.org-pos{font-size:10px;color:var(--t2);margin-top:2px}
.org-children{display:flex;gap:18px;margin-top:24px;position:relative;flex-wrap:wrap;justify-content:center}
.org-children::before{content:'';position:absolute;top:-12px;left:50%;width:2px;height:12px;background:var(--border2)}
.org-child{position:relative;display:flex;flex-direction:column;align-items:center}
.org-child::before{content:'';position:absolute;top:-12px;left:50%;width:2px;height:12px;background:var(--border2)}

/* ── LEAVE BALANCE BARS ── */
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.lb-row:last-child{border-bottom:none}
.lb-icon{width:38px;height:38px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.lb-info{flex:1}
.lb-name{font-size:12px;font-weight:700;color:var(--text)}
.lb-bar{background:var(--s2);border-radius:20px;height:6px;margin-top:6px;overflow:hidden;width:100%}
.lb-fill{height:100%;border-radius:20px;background:var(--blue);transition:width .3s}
.lb-fill.warn{background:#d97706}
.lb-fill.over{background:var(--red)}
.lb-fill.gr{background:var(--green)}
.lb-vals{font-size:11px;color:var(--t2);margin-top:3px;display:flex;justify-content:space-between}
.lb-num{font-size:18px;font-weight:800;color:var(--text);min-width:50px;text-align:right}

/* ── CALENDAR / WHO'S ON LEAVE ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal-day{background:var(--s2);border-radius:6px;padding:8px;min-height:70px;font-size:10px}
.cal-day.today{background:var(--blue2);border:1.5px solid var(--blue)}
.cal-day.weekend{background:var(--s3);opacity:.6}
.cal-day-num{font-weight:800;font-size:11px;color:var(--text);margin-bottom:4px}
.cal-leave-pill{font-size:9px;padding:1px 5px;border-radius:3px;background:#fee2e2;color:var(--red);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-leave-pill.an{background:#dbeafe;color:#1e40af}
.cal-leave-pill.sk{background:#fef3c7;color:#92400e}
.cal-leave-pill.cs{background:#e0e7ff;color:#3730a3}
.cal-leave-pill.mt{background:#fce7f3;color:#9d174d}

/* ── APPROVAL WORKFLOW BUILDER ── */
.workflow-builder{background:var(--s2);border-radius:var(--r2);padding:18px;margin-bottom:16px}
.wf-step{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;position:relative}
.wf-step-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wf-step-num{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.wf-step-title{font-weight:700;font-size:13px;flex:1}
.wf-arrow{text-align:center;color:var(--t3);font-size:20px;margin:4px 0}
.wf-add{border:2px dashed var(--border2);border-radius:var(--r);padding:12px;text-align:center;cursor:pointer;color:var(--t2);font-size:12px;transition:all .15s}
.wf-add:hover{border-color:var(--blue);color:var(--blue);background:var(--blue2)}

/* ── UPLOAD ZONE ── */
.upz{border:2px dashed var(--border2);border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;transition:all .15s;color:var(--t3);font-size:12px;line-height:1.7}
.upz:hover{border-color:var(--blue);background:var(--blue2);color:var(--blue)}
.upz.done{border-style:solid;border-color:var(--green);background:var(--green2);color:var(--green)}

/* ── HISTORY TIMELINE ── */
.timeline{display:flex;flex-direction:column;gap:0;position:relative}
.timeline::before{content:'';position:absolute;left:18px;top:0;bottom:0;width:2px;background:var(--border);z-index:0}
.tl-item{display:flex;gap:14px;position:relative;z-index:1;padding-bottom:18px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;border:3px solid #fff;box-shadow:0 0 0 2px var(--border);background:var(--blue2)}
.tl-dot.gr{background:var(--green3)}.tl-dot.rd{background:var(--red3)}.tl-dot.am{background:var(--amber2)}
.tl-body{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px 14px;margin-top:4px}
.tl-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.tl-action{font-size:12px;font-weight:700;color:var(--text)}
.tl-who{font-size:11px;color:var(--t2)}
.tl-when{font-size:10px;color:var(--t3);margin-left:auto}
.tl-detail{font-size:12px;color:var(--t2);line-height:1.6}

/* ── PAYSLIP DOC ── */
.psl-doc{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:24px;font-size:12px}
.psl-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;padding-bottom:14px;border-bottom:2.5px solid var(--blue3)}
.psl-no{font-family:'Courier New',monospace;font-size:16px;font-weight:900;color:var(--blue3);letter-spacing:.04em}
.psl-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);gap:12px}
.psl-row .lbl{color:var(--t2);flex-shrink:0}
.psl-row .val{font-weight:600;text-align:right}
.psl-row.total{padding:11px 15px;background:var(--blue2);border-radius:var(--r);margin:12px 0;font-weight:800;font-size:15px;border-bottom:none}
.psl-row.gr{padding:11px 15px;background:var(--green2);border-radius:var(--r);margin:12px 0;font-weight:800;font-size:15px;border-bottom:none;color:var(--green)}
.psl-section{font-size:11px;font-weight:800;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border)}

/* ── DOCUMENT PREVIEW (letters) ── */
.letter-doc{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:36px 40px;font-family:'Times New Roman',serif;font-size:13px;line-height:1.7;color:#222;min-height:600px}
.letter-doc h1{color:var(--blue3);font-size:18px;margin-bottom:18px;text-align:center;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--blue3);padding-bottom:10px}
.letter-doc .lt-meta{margin-bottom:24px;font-size:12px;color:var(--t2)}
.letter-doc .lt-meta div{margin-bottom:3px}
.letter-doc p{margin-bottom:12px}
.letter-doc .lt-sig{margin-top:60px}
.letter-doc .lt-sig-line{border-top:1px solid #333;width:200px;padding-top:5px;font-size:11px;margin-top:30px}

/* ── BIRTHDAY CARD ── */
.bday-card{background:linear-gradient(135deg,#fce7f3,#fef3c7);border:1px solid #f9a8d4;border-radius:var(--r);padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.bday-emoji{font-size:28px;flex-shrink:0}
.bday-info{flex:1}
.bday-name{font-size:13px;font-weight:700;color:var(--text)}
.bday-date{font-size:11px;color:var(--t2);margin-top:2px}
.bday-when{font-size:10px;font-weight:800;color:var(--purple);text-transform:uppercase;letter-spacing:.05em}

/* ── APPRAISAL / RATING ── */
.rating{display:flex;gap:3px}
.rating-star{font-size:18px;color:var(--border2);cursor:pointer;transition:color .1s}
.rating-star.on{color:#f59e0b}
.rating-star:hover{color:#fbbf24}
.appraisal-criterion{padding:12px 0;border-bottom:1px solid var(--border)}
.appraisal-criterion:last-child{border-bottom:none}
.ac-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px}
.ac-desc{font-size:11px;color:var(--t2);margin-bottom:6px}
.ac-score{display:flex;align-items:center;gap:10px}

/* ── POLICY VIDEO LIST ── */
.policy-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:14px;margin-bottom:8px;transition:all .12s}
.policy-card:hover{border-color:var(--blue)}
.policy-thumb{width:90px;height:60px;background:var(--s2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;color:var(--t2)}
.policy-thumb.video{background:linear-gradient(135deg,#1849a9,#0d2d6e);color:#fff}
.policy-info{flex:1;min-width:0}
.policy-title{font-size:13px;font-weight:700;color:var(--text)}
.policy-desc{font-size:11px;color:var(--t2);margin-top:3px}
.policy-meta{font-size:10px;color:var(--t3);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}

/* ── ATTACHMENT VIEWER ── */
.att-viewer{background:var(--s2);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.att-slot{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);font-size:12px}
.att-slot .att-ic{font-size:18px;flex-shrink:0}
.att-slot .att-name{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-slot .att-size{font-size:10px;color:var(--t3);flex-shrink:0}

/* ── PROGRESS / PWD STRENGTH ── */
.pwd-strength{height:4px;border-radius:20px;margin-top:6px;transition:all .3s;background:var(--s2)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.urg-dot{width:10px;height:10px;border-radius:50%;background:var(--orange);animation:pulse 1.8s infinite;flex-shrink:0}

/* ── HELP BUTTON ── */
.help-btn{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--blue3);color:#fff;border:none;cursor:pointer;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(13,45,110,.4);z-index:200;transition:all .2s}
.help-btn:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(13,45,110,.5)}

/* ── SOCIAL ICONS ── */
.social-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.social-chip{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;background:var(--s2);color:var(--t2);display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:1px solid var(--border)}
.social-chip:hover{background:var(--blue2);color:var(--blue);border-color:var(--blue)}

/* ── SEQUENCE DOCUMENT NUMBER DISPLAY ── */
.docno{font-family:'Courier New',monospace;font-size:13px;font-weight:800;color:var(--blue3);background:var(--blue2);padding:3px 9px;border-radius:6px;letter-spacing:.04em;display:inline-block}

/* ── KPI INDICATOR ── */
.kpi-row{display:flex;align-items:center;gap:8px;font-size:11px}
.kpi-up{color:var(--green);font-weight:700}
.kpi-down{color:var(--red);font-weight:700}

/* ── PRINT STYLES ── */
@media print {
  body *{visibility:hidden}
  .print-doc, .print-doc *{visibility:visible}
  .print-doc{position:fixed;inset:0;width:210mm;margin:0 auto;padding:12mm;background:#fff;z-index:9999;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print{display:none!important}
}

@media(max-width:900px){

  .fg2,.fg3{grid-template-columns:1fr}
  .punch-bar{flex-direction:column;align-items:stretch}
}

// ── PAYSLIPS (sample for current user view) ──
function generatePayslip(empId, period){
  const emp = findEmp(empId);
  if(!emp) return null;
  const basic = emp.salary.basic;
  const allow = emp.salary.allowances;
  const gross = basic + allow;
  const pension = Math.round(basic * 0.07);  // 7% employee pension contribution (Maldives MRPS)
  const tax = gross > 60000 ? Math.round((gross - 60000) * 0.15) : 0;  // simplified
  const net = gross - pension - tax;
  return {
    id:`${ENTITIES[emp.entity].payslipPrefix}-${period}-${emp.id.toUpperCase()}`,
    empId:emp.id, period, entity:emp.entity,
    basic, allowances:allow, gross, pension, tax, net,
    deductions:[
      { label:'Pension (MRPS 7%)', amount:pension },
      { label:'Income tax', amount:tax }
    ],
    earnings:[
      { label:'Basic Salary', amount:basic },
      { label:'Allowances', amount:allow }
    ]
  };
}

//  CORE HELPERS
// ═══════════════════════════════════════════════════
function el(id){ return document.getElementById(id); }
function fmt(n){ return new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0); }
function fmtInt(n){ return new Intl.NumberFormat('en-US').format(n||0); }
function fmtDate(d){ if(!d)return '—'; return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function fmtDateShort(d){ if(!d)return '—'; return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function today(){ return new Date().toISOString().slice(0,10); }
function now(){ return new Date(); }
function timeStr(){ const d=now(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function daysBetween(d1,d2){ const a=new Date(d1),b=new Date(d2); return Math.round((b-a)/(1000*60*60*24))+1; }
function avatar(emp, size='emp-avatar'){
  if(!emp) return `<div class="${size}">??</div>`;
  if(emp.photo) return `<div class="${size}" style="background-image:url('${emp.photo}')"></div>`;
  // generate stable color from id
  const colors = ['#1849a9','#166534','#92400e','#6b21a8','#115e59','#9d174d','#0891b2','#c2410c'];
  const c = colors[emp.id.charCodeAt(0)%colors.length];
  return `<div class="${size}" style="background:${c}">${emp.initials}</div>`;
}
function htmlEsc(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]); }

function toast(msg, type='success'){
  const t=el('toast'); if(!t) return;
  const colors={success:['#16a34a','#dcfce7'],error:['#dc2626','#fee2e2'],info:['#1849a9','#dbeafe'],warn:['#d97706','#fef3c7']};
  const[border,bg]=colors[type]||colors.success;
  t.innerHTML=`<div style="background:${bg};border-left:4px solid ${border};padding:14px 18px;border-radius:10px;color:${border}">${htmlEsc(msg)}</div>`;
  t.style.opacity='1';
  setTimeout(()=>t.style.opacity='0', 3500);
}

function openModal(html, size=''){
  const m=el('modal');
  m.innerHTML=`<div class="mbd" onclick="if(event.target===this)closeModal()"><div class="modal ${size}">${html}</div></div>`;
}
function closeModal(){ el('modal').innerHTML=''; }

// Permission helpers
function isHR(){ return CU && (CU.role==='sysadmin'||CU.role==='hr_director'||CU.role==='hr_manager'||CU.role==='hr_assistant'); }
function isHRAdmin(){ return CU && (CU.role==='sysadmin'||CU.role==='hr_director'||CU.role==='hr_manager'); }
function isDirector(){ return CU && (CU.role==='sysadmin'||CU.role==='hr_director'); }
function isSysAdmin(){ return CU && CU.role==='sysadmin'; }

// Find supervisees of a manager
function getSupervisees(empId){ return EMPLOYEES.filter(e=>e.supervisor===empId); }

// Find pending leave requests this user can act on
function pendingLeaveTasks(){
  if(!CU) return 0;
  return LEAVE_REQS.filter(lr=>{
    if(lr.status!=='pending') return false;
    return lr.approvalSteps.some(s=>s.status==='pending'&&s.who===CU.id);
  }).length;
}

function pendingInquiryTasks(){
  if(!CU) return 0;
  return INQUIRIES.filter(i=>i.status!=='resolved'&&i.assignedTo===CU.id).length;
}

function expiringSoon(){
  // Visa/permit expiries within 60 days
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()+60);
  return EMPLOYEES.filter(e=>{
    if(e.type!=='foreign'||!e.foreign) return false;
    const dates=[e.foreign.passportExpiry,e.foreign.visaExpiry,e.foreign.workPermitExpiry,e.foreign.medicalExpiry,e.foreign.quotaExpiry].filter(Boolean);
    return dates.some(d=>new Date(d)<=cutoff);
  }).length;
}

function fillPlaceholders(text, emp, extra){
  if(!text) return '';
  extra = extra || {};
  const supervisor = findEmp(emp.supervisor);
  const map = {
    EMPLOYEE_NAME: emp.name,
    FIRST_NAME:    emp.name.split(' ')[0],
    POSITION:      emp.position,
    DEPARTMENT:    DEPTS[emp.department] ? DEPTS[emp.department].name : emp.department,
    ENTITY:        emp.entity,
    ENTITY_NAME:   ENTITIES[emp.entity] ? ENTITIES[emp.entity].name : emp.entity,
    REG_NO:        emp.regNo,
    JOIN_DATE:     fmtDate(emp.joinDate),
    SALARY:        `${emp.salary.currency} ${fmt(emp.salary.basic + emp.salary.allowances)}`,
    BASIC:         `${emp.salary.currency} ${fmt(emp.salary.basic)}`,
    ALLOWANCES:    `${emp.salary.currency} ${fmt(emp.salary.allowances)}`,
    DATE:          fmtDate(today()),
    EMAIL:         emp.email,
    PHONE:         emp.phone,
    NATIONALITY:   emp.nationality || 'Maldivian',
    SUPERVISOR:    supervisor ? supervisor.name : 'HR Department',
    PURPOSE:       extra.purpose || '[purpose]',
    END_DATE:      extra.endDate || fmtDate(today())
  };
  return text.replace(/\{([A-Z_]+)\}/g, (m, key) => (map[key] !== undefined ? map[key] : m));
}

function pdfHeader(doc, entity, title, docNo){
  const ent = ENTITIES[entity] || ENTITIES.PSMS;
  doc.setFillColor(13, 45, 110);
  doc.rect(0, 0, 210, 28, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.text(ent.name, 14, 14);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.text('PeopleFlow HR · Human Resource Management', 14, 20);
  if(docNo){
    doc.setFontSize(10);
    doc.setFont('helvetica','bold');
    doc.text(docNo, 196, 14, { align:'right' });
    doc.setFont('helvetica','normal');
    doc.setFontSize(8);
    doc.text(fmtDate(today()), 196, 20, { align:'right' });
  }
  doc.setTextColor(28, 32, 48);
  if(title){
    doc.setFont('helvetica','bold');
    doc.setFontSize(14);
    doc.text(title, 105, 40, { align:'center' });
    doc.setLineWidth(0.5);
    doc.setDrawColor(13, 45, 110);
    doc.line(60, 43, 150, 43);
  }
}

function pdfFooter(doc){
  const pageCount = doc.internal.getNumberOfPages();
  for(let i = 1; i <= pageCount; i++){
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text(`PeopleFlow HR · System-generated document · Page ${i} of ${pageCount}`, 105, 290, { align:'center' });
  }
}

function pdfPayslip(empId, period){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const emp = findEmp(empId);
  const slip = generatePayslip(empId, period);
  const monthName = new Date(period+'-01').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  pdfHeader(doc, emp.entity, `Payslip — ${monthName}`, slip.id);

  let y = 50;
  doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.text('EMPLOYEE', 14, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  y += 5; doc.text(emp.name, 14, y);
  y += 5; doc.setFontSize(9); doc.setTextColor(90); doc.text(`${emp.regNo} · ${emp.position}`, 14, y);
  y += 4; doc.text(`${DEPTS[emp.department].name}`, 14, y);

  doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(28,32,48);
  doc.text('BANK DETAILS', 120, 50);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90);
  doc.text(`${emp.bankAcc.bank}`, 120, 56);
  doc.text(`A/C: ${emp.bankAcc.accNo}`, 120, 60);
  doc.text(`${emp.bankAcc.branch}`, 120, 64);

  // Earnings table
  doc.autoTable({
    startY: 75,
    head: [['EARNINGS', 'AMOUNT']],
    body: slip.earnings.map(e => [e.label, `${emp.salary.currency} ${fmt(e.amount)}`]),
    foot: [['Gross Pay', `${emp.salary.currency} ${fmt(slip.gross)}`]],
    theme: 'striped',
    headStyles: { fillColor:[24,73,169], fontSize:9 },
    footStyles: { fillColor:[238,242,252], textColor:[13,45,110], fontSize:10, fontStyle:'bold' },
    columnStyles: { 1: { halign:'right', font:'courier' } }
  });

  // Deductions table
  doc.autoTable({
    startY: doc.lastAutoTable.finalY + 8,
    head: [['DEDUCTIONS', 'AMOUNT']],
    body: slip.deductions.map(d => [d.label, `${emp.salary.currency} ${fmt(d.amount)}`]),
    theme: 'striped',
    headStyles: { fillColor:[153,27,27], fontSize:9 },
    columnStyles: { 1: { halign:'right', font:'courier', textColor:[153,27,27] } }
  });

  // Net Pay
  const finalY = doc.lastAutoTable.finalY + 10;
  doc.setFillColor(220, 252, 231);
  doc.rect(14, finalY, 182, 14, 'F');
  doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.setTextColor(22,101,52);
  doc.text('NET PAY', 18, finalY + 9);
  doc.setFont('courier','bold');
  doc.text(`${emp.salary.currency} ${fmt(slip.net)}`, 192, finalY + 9, { align:'right' });

  doc.setTextColor(120); doc.setFontSize(8); doc.setFont('helvetica','italic');
  doc.text(`Paid via PayFlow Pro · Reference: ${ENTITIES[emp.entity].regPrefix}/BML/MVR/${period.slice(2,4)}/0XX`, 105, finalY + 22, { align:'center' });

  pdfFooter(doc);
  doc.save(`Payslip_${emp.name.replace(/\s+/g,'_')}_${period}.pdf`);
  toast(`Payslip downloaded`, 'success');
  logAudit('document.download', slip.id, `Downloaded payslip PDF for ${emp.name} (${period})`);
}

function pdfLetter(docId){
  const { jsPDF } = window.jspdf;
  const d = DOCUMENTS.find(x => x.id === docId); if(!d) return;
  const e = findEmp(d.empId);
  const issuedBy = findEmp(d.issuedBy);
  const doc = new jsPDF();
  pdfHeader(doc, e.entity, d.title, d.docNo);

  let y = 55;
  doc.setFontSize(9); doc.setTextColor(80);
  doc.text(`Date: ${fmtDate(d.issuedDate)}`, 196, y, { align:'right' });
  y += 8;
  doc.setTextColor(28,32,48); doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('To:', 14, y);
  doc.setFont('helvetica','normal');
  doc.text(`${e.name}`, 25, y);
  y += 5; doc.text(`${e.regNo} · ${e.position}`, 25, y);
  y += 5; doc.text(`${DEPTS[e.department].name}`, 25, y);

  y += 12;
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text(`Dear ${e.name.split(' ')[0]},`, 14, y);

  y += 8;
  const lines = doc.splitTextToSize(d.content, 182);
  doc.text(lines, 14, y);
  y += lines.length * 5.5;

  if(d.purpose){
    y += 4;
    doc.setFont('helvetica','italic');
    doc.text(`Issued for: ${d.purpose}`, 14, y);
    doc.setFont('helvetica','normal');
  }

  y += 12;
  doc.text('Should you require any clarification, please contact the HR department.', 14, y);

  y += 22;
  doc.text('Yours sincerely,', 14, y);
  y += 18;
  doc.setLineWidth(0.3); doc.line(14, y, 80, y);
  y += 4;
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text(issuedBy ? issuedBy.name : 'HR Department', 14, y);
  y += 4;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90);
  doc.text(`${issuedBy ? issuedBy.position : 'Human Resources'}`, 14, y);
  y += 4;
  doc.text(`${ENTITIES[e.entity].name}`, 14, y);

  pdfFooter(doc);
  doc.save(`${d.docNo}_${d.title.replace(/\s+/g,'_')}.pdf`);
  toast('Letter downloaded as PDF', 'success');
  logAudit('document.download', d.docNo, `Downloaded ${d.kind} letter PDF for ${e.name}`);
}

function pdfEvaluation(evId){
  const { jsPDF } = window.jspdf;
  const ev = EVALUATIONS.find(x => x.id === evId); if(!ev) return;
  const e = findEmp(ev.empId), evor = findEmp(ev.evaluator);
  const tpl = APPRAISAL_TEMPLATES.find(t => t.id === ev.templateId);
  const doc = new jsPDF();
  pdfHeader(doc, e.entity, `Performance Evaluation`, ev.docNo);

  let y = 55;
  doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.text('EMPLOYEE', 14, y); doc.text('OVERALL SCORE', 120, y);
  y += 6; doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text(e.name, 14, y);
  doc.setFont('helvetica','bold'); doc.setFontSize(20);
  doc.setTextColor(ev.overallScore>=4?22:ev.overallScore>=3?180:153, ev.overallScore>=4?101:ev.overallScore>=3?100:27, ev.overallScore>=4?52:ev.overallScore>=3?14:27);
  doc.text(`${ev.overallScore.toFixed(2)} / 5`, 120, y+2);

  doc.setTextColor(28,32,48); doc.setFontSize(9); doc.setFont('helvetica','normal');
  y += 5; doc.text(`${e.regNo} · ${e.position}`, 14, y);
  y += 4; doc.text(`Period: ${ev.period} · Evaluated by: ${evor?evor.name:'—'} · ${fmtDate(ev.date)}`, 14, y);

  if(tpl){
    doc.autoTable({
      startY: y + 8,
      head: [['Criterion', 'Description', 'Weight', 'Score']],
      body: tpl.criteria.map(c => [
        c.name,
        c.desc,
        `${c.weight}%`,
        `${ev.scores[c.id] || 0} / 5`
      ]),
      theme: 'striped',
      headStyles: { fillColor:[24,73,169], fontSize:9 },
      columnStyles: { 0: { fontStyle:'bold' }, 2: { halign:'center' }, 3: { halign:'center', fontStyle:'bold' } }
    });
  }

  if(ev.comments){
    const fy = doc.lastAutoTable.finalY + 10;
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('OVERALL COMMENTS', 14, fy);
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const cl = doc.splitTextToSize(ev.comments, 182);
    doc.text(cl, 14, fy + 6);
  }

  pdfFooter(doc);
  doc.save(`${ev.docNo}_Evaluation_${e.name.replace(/\s+/g,'_')}.pdf`);
  toast('Evaluation downloaded', 'success');
  logAudit('document.download', ev.docNo, `Downloaded evaluation PDF for ${e.name}`);
}

// ═══════════════════════════════════════════════════
function exportExcel(rows, sheetName, fileName){
  if(!rows || !rows.length){ toast('No data to export','warn'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  // Auto-fit columns
  const cols = Object.keys(rows[0]).map(k => ({
    wch: Math.max(k.length, ...rows.map(r => String(r[k]||'').length)) + 2
  }));
  ws['!cols'] = cols;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, fileName);
  toast(`Exported ${rows.length} rows to Excel`, 'success');
  logAudit('export.excel', fileName, `Exported ${rows.length} rows · ${sheetName}`);
}

//  EMAIL DOCUMENT TO EMPLOYEE (mailto + log)
// ═══════════════════════════════════════════════════
function emailDocument(kind, refId){
  let emp, subject, body, docRef;

  if(kind === 'payslip'){
    const [empId, period] = refId.split('|');
    emp = findEmp(empId);
    const slip = generatePayslip(empId, period);
    const monthName = new Date(period+'-01').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    subject = `Payslip — ${monthName} — ${emp.name}`;
    body = `Dear ${emp.name.split(' ')[0]},

Please find your salary statement for ${monthName} below. The PDF copy can also be downloaded from the PeopleFlow HR portal.

Payslip No:  ${slip.id}
Period:      ${monthName}
Gross Pay:   ${emp.salary.currency} ${fmt(slip.gross)}
Deductions:  ${emp.salary.currency} ${fmt(slip.pension + slip.tax)}
Net Pay:     ${emp.salary.currency} ${fmt(slip.net)}

Salary has been paid via PayFlow Pro. Please verify the credit in your bank account.

For any queries, please raise an inquiry through the HR portal.

Regards,
HR Department
${ENTITIES[emp.entity].name}`;
    docRef = slip.id;
  }
  else if(kind === 'letter'){
    const d = DOCUMENTS.find(x => x.id === refId); if(!d) return;
    emp = findEmp(d.empId);
    subject = `${d.title} — ${d.docNo}`;
    body = `Dear ${emp.name.split(' ')[0]},

Please find attached your ${d.title} (Ref: ${d.docNo}).

${d.content}

This letter has been issued for: ${d.purpose}

For any clarification, please contact the HR department.

Regards,
HR Department
${ENTITIES[emp.entity].name}`;
    docRef = d.docNo;
  }
  else if(kind === 'evaluation'){
    const ev = EVALUATIONS.find(x => x.id === refId); if(!ev) return;
    emp = findEmp(ev.empId);
    subject = `Performance Evaluation — ${ev.period}`;
    body = `Dear ${emp.name.split(' ')[0]},

Your performance evaluation for the period "${ev.period}" has been completed.

Overall Score: ${ev.overallScore.toFixed(2)} / 5

${ev.comments || ''}

Please review the full evaluation in the HR portal. Should you wish to discuss your evaluation, please contact your supervisor or the HR department.

Regards,
HR Department`;
    docRef = ev.docNo;
  }
  else if(kind === 'leave'){
    const l = LEAVE_REQS.find(x => x.id === refId); if(!l) return;
    emp = findEmp(l.empId);
    const lt = LEAVE_TYPES.find(t=>t.id===l.leaveType);
    subject = `Leave Request ${l.status === 'approved' ? 'Approved' : 'Update'} — ${l.docNo}`;
    body = `Dear ${emp.name.split(' ')[0]},

Your leave request has been ${l.status}.

Doc No:    ${l.docNo}
Type:      ${lt.name}
From:      ${fmtDate(l.from)}
To:        ${fmtDate(l.to)}
Days:      ${l.days}
Status:    ${l.status.toUpperCase()}

${l.status === 'approved' ? 'Please ensure proper handover of your responsibilities before your leave period.' : 'Please contact HR if you have any questions.'}

Regards,
HR Department`;
    docRef = l.docNo;
  }
  else if(kind === 'custom'){
    emp = findEmp(refId);
    subject = '';
    body = '';
    docRef = '';
  }

  if(!emp){ toast('Could not find recipient', 'error'); return; }

  // Show email composer modal so HR can review/edit before sending
  openModal(`
    <div class="mh"><div class="mt">📧 Email to ${emp.name}</div><button class="mc" onclick="closeModal()">×</button></div>
    <div class="mb">
      <div class="al al-i">📨 The email will open in your default mail client (mailto:) and a record will be saved to the employee's email log.</div>

      <div class="fg2">
        <div class="fg"><label class="fl">To</label><input class="fi" id="em_to" value="${htmlEsc(emp.email)}"></div>
        <div class="fg"><label class="fl">Cc</label><input class="fi" id="em_cc" placeholder="optional"></div>
      </div>
      <div class="fg"><label class="fl">Subject<span class="req">*</span></label><input class="fi" id="em_subj" value="${htmlEsc(subject)}"></div>
      <div class="fg"><label class="fl">Message</label><textarea class="fta" id="em_body" style="min-height:240px;font-family:'Courier New',monospace;font-size:11px">${htmlEsc(body)}</textarea></div>

      ${docRef ? `<div class="al al-w">📎 <strong>Attachment reminder:</strong> Don't forget to download the PDF and attach it to your email — mailto: doesn't carry attachments. Document ref: <span class="docno">${docRef}</span></div>` : ''}
    </div>
    <div class="mf">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-p" onclick="sendEmail('${emp.id}','${docRef}')">📨 Open Email Client</button>
    </div>
  `,'lg');
}

function sendEmail(empId, docRef){
  const emp = findEmp(empId);
  const to = el('em_to').value;
  const cc = el('em_cc').value;
  const subj = el('em_subj').value;
  const body = el('em_body').value;
  if(!to || !subj){ toast('Please provide recipient and subject', 'error'); return; }

  // Build mailto URL
  let url = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
  if(cc) url += `&cc=${encodeURIComponent(cc)}`;
  window.open(url, '_blank');

  // Log it
  logEmail(empId, subj, body, docRef);
  logAudit('email.send', docRef||'', `Emailed "${subj}" to ${emp.name}`);
  closeModal();
  toast('Email opened in your mail client · log saved', 'success');
}

function renderPunchBar(){
  if(!CU){ el('punchBar').innerHTML=''; return; }
  const todayLog = ATTENDANCE.find(a=>a.empId===CU.id && a.date===today() && a.status!=='absent' && a.status!=='on-leave');
  const signedIn = todayLog && todayLog.signIn;
  const signedOut = todayLog && todayLog.signOut;

  let statusText, dotClass, btn;
  if(!signedIn){
    statusText = 'Not signed in';
    dotClass = 'out';
    btn = `<button class="punch-btn in" onclick="doSignIn()">📍 Sign In Now</button>`;
  } else if(!signedOut){
    statusText = `Signed in at ${todayLog.signIn} · ${todayLog.inLoc||'location detected'}`;
    dotClass = '';
    btn = `<button class="punch-btn out" onclick="doSignOut()">📍 Sign Out</button>`;
  } else {
    statusText = `Today: ${todayLog.signIn} → ${todayLog.signOut}`;
    dotClass = 'out';
    btn = `<button class="punch-btn disabled" disabled>✓ Day Complete</button>`;
  }

  el('punchBar').innerHTML = `
    <div class="punch-bar">
      <div class="punch-status">
        <div class="punch-status-dot ${dotClass}"></div>
        <div class="punch-status-text">
          <div class="ps-lbl">Attendance Status</div>
          <div class="ps-val">${statusText}</div>
        </div>
      </div>
      <div class="punch-time" id="punchClock">${timeStr()}</div>
      ${btn}
    </div>`;
  // tick the clock
  if(window._clockI) clearInterval(window._clockI);
  window._clockI = setInterval(()=>{
    const c = el('punchClock');
    if(c) c.textContent = (function(){ const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`; })();
  }, 1000);
}

function showAlerts(){
  const alerts = [];
  // Visa alerts
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()+60);
  EMPLOYEES.filter(e=>e.type==='foreign'&&e.foreign).forEach(e=>{
    [['passportExpiry','Passport'],['visaExpiry','Visa'],['workPermitExpiry','Work Permit'],['medicalExpiry','Medical Insurance'],['quotaExpiry','Quota Slot']].forEach(([k,lbl])=>{
      const d=e.foreign[k]; if(!d) return;
      if(new Date(d)<=cutoff){
        const days=Math.ceil((new Date(d)-new Date())/(1000*60*60*24));
        alerts.push({type:'warn',msg:`${e.name} — ${lbl} expires in ${days} days (${fmtDate(d)})`,go:()=>nav('foreign-emps')});
      }
    });
  });
  // Pending tasks
  if(pendingLeaveTasks()) alerts.push({type:'info',msg:`${pendingLeaveTasks()} leave request(s) awaiting your approval`,go:()=>nav('leave-mgmt')});
  if(pendingInquiryTasks()) alerts.push({type:'info',msg:`${pendingInquiryTasks()} inquiry/inquiries assigned to you`,go:()=>nav('inquiry-mgmt')});

  const html = `
    <div class="mh"><div class="mt">Alerts & Notifications</div><button class="mc" onclick="closeModal()">×</button></div>
    <div class="mb">
      ${alerts.length? alerts.map((a,i)=>`<div class="al al-${a.type==='warn'?'w':'i'}" style="cursor:pointer" onclick="closeModal();(${a.go.toString()})()">${a.msg}</div>`).join('') : '<div class="al al-s">All clear — no urgent alerts</div>'}
    </div>
    <div class="mf"><button class="btn btn-p" onclick="closeModal()">Close</button></div>`;
  openModal(html,'sm');
}

function doGlobalSearch(q){
  const r=el('globalSearchResults');
  if(!q || q.length<2){ r.style.display='none'; return; }
  q=q.toLowerCase();
  const matches=[];
  EMPLOYEES.forEach(e=>{ if(e.name.toLowerCase().includes(q)||e.email.toLowerCase().includes(q)||e.regNo.toLowerCase().includes(q)) matches.push({type:'Employee',item:e,go:()=>{viewEmployee(e.id);}}); });
  LEAVE_REQS.forEach(l=>{ if(l.docNo.toLowerCase().includes(q)) matches.push({type:'Leave',item:l,go:()=>nav('leave-mgmt')}); });
  INQUIRIES.forEach(i=>{ if(i.docNo.toLowerCase().includes(q)||i.subject.toLowerCase().includes(q)) matches.push({type:'Inquiry',item:i,go:()=>nav('inquiry-mgmt')}); });
  DOCUMENTS.forEach(d=>{ if(d.docNo.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)) matches.push({type:'Document',item:d,go:()=>nav('documents-mgmt')}); });
  if(matches.length===0){ r.innerHTML='<div style="padding:14px;color:var(--t3);text-align:center">No results</div>'; r.style.display='block'; return; }
  r.innerHTML = matches.slice(0,8).map(m=>{
    const t=m.item; const label=t.name||t.docNo||t.title;
    return `<div style="padding:9px 13px;border-bottom:1px solid var(--border);cursor:pointer" onclick="(${m.go.toString()})();this.parentElement.style.display='none';document.getElementById('globalSearchInput').value=''"><span class="bdg b-sub" style="margin-right:8px">${m.type}</span>${htmlEsc(label)}</div>`;
  }).join('');
  r.style.display='block';
}

// Birthday helper
function upcomingBirthdays(days=30){
  const today = new Date();
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()+days);
  return EMPLOYEES.map(e=>{
    if(!e.dob) return null;
    const dob = new Date(e.dob);
    let next = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
    if(next<today.setHours(0,0,0,0)) next = new Date(today.getFullYear()+1, dob.getMonth(), dob.getDate());
    if(next>cutoff) return null;
    const daysAway = Math.round((next-new Date().setHours(0,0,0,0))/(1000*60*60*24));
    return { emp:e, date:next, daysAway };
  }).filter(Boolean).sort((a,b)=>a.daysAway-b.daysAway);
}

// Leave status badge
function leaveBadge(status){
  const m={ pending:['b-pap','Pending'], approved:['b-paid','Approved'], rejected:['b-rej','Rejected'], draft:['b-draft','Draft'], cancelled:['b-draft','Cancelled'] };
  const[cls,lbl]=m[status]||['b-draft',status];
  return `<span class="bdg ${cls}"><span class="bd"></span>${lbl}</span>`;
}
function inqBadge(status){
  const m={ pending:['b-pap','Pending'], 'in-progress':['b-chk','In Progress'], resolved:['b-paid','Resolved'], rejected:['b-rej','Rejected'] };
  const[cls,lbl]=m[status]||['b-draft',status];
  return `<span class="bdg ${cls}"><span class="bd"></span>${lbl}</span>`;
}

// ── My Attendance ──
function renderMyAttendance(){
  const myLogs = ATTENDANCE.filter(a=>a.empId===CU.id).sort((a,b)=>b.date.localeCompare(a.date));
  const thisMonth = myLogs.filter(a=>a.date.startsWith(today().slice(0,7))).filter(a=>a.signIn);
  const totalDays = thisMonth.length;
  const completedDays = thisMonth.filter(a=>a.signOut).length;
  const avgHours = thisMonth.filter(a=>a.signOut).map(a=>{
    const[ih,im]=a.signIn.split(':').map(Number);
    const[oh,om]=a.signOut.split(':').map(Number);
    return ((oh*60+om)-(ih*60+im))/60;
  }).reduce((s,h)=>s+h,0)/Math.max(1,completedDays);

  return `
    <div class="ph">
      <div><div class="pt">My Attendance</div><div class="ps">Sign-in records and timesheet</div></div>
    </div>

    <div class="sgrid g4">

      <div class="cb flush">
        <div class="tw"><table>

              if(a.signIn&&a.signOut){

function nextSeqPreview(prefix){ return `${prefix}-${new Date().getFullYear()}-${String((SEQUENCES[prefix]||0)+1).padStart(4,'0')}`; }

function updateLeaveBal(){
  const t=el('lvType').value;
  if(!t){ el('lvBalInfo').innerHTML=''; return; }
  const lt=LEAVE_TYPES.find(x=>x.id===t);
  const bal=CU.leaveBalance[t]||0;
  el('lvBalInfo').innerHTML=`<div class="al ${bal<5?'al-w':'al-i'}">${lt.icon} You have <strong>${bal} days</strong> of ${lt.name} available. ${lt.needsDoc?'<br>📎 Supporting document required for this leave type.':''}</div>`;
}

function calcDays(){
  const f=el('lvFrom').value, t=el('lvTo').value;
  if(!f||!t){ el('lvDays').value=''; return; }
  if(new Date(t)<new Date(f)){ el('lvDays').value=''; return; }
  el('lvDays').value=daysBetween(f,t);
}

function submitLeave(){
  const type=el('lvType').value;
  const from=el('lvFrom').value;
  const to=el('lvTo').value;
  const reason=el('lvReason').value.trim();
  const handover=el('lvHandover').value.trim();
  if(!type||!from||!to||!reason){ toast('Please fill all required fields','error'); return; }
  if(new Date(to)<new Date(from)){ toast('End date must be after start date','error'); return; }
  const days=daysBetween(from,to);
  const bal=CU.leaveBalance[type]||0;
  if(days>bal){ toast(`Insufficient ${LEAVE_TYPES.find(x=>x.id===type).name} balance (${bal} available, ${days} requested)`,'error'); return; }

  const supervisor = findEmp(CU.supervisor);
  const hrMgr = EMPLOYEES.find(e=>e.role==='hr_manager');
  const steps=[];
  if(supervisor) steps.push({ name:'Direct Supervisor', who:supervisor.id, status:'pending', date:null, note:'' });
  if(hrMgr&&hrMgr.id!==CU.id) steps.push({ name:'HR Manager', who:hrMgr.id, status:'pending', date:null, note:'' });
  if(days>5){
    const hrDir = EMPLOYEES.find(e=>e.role==='hr_director');
    if(hrDir&&hrDir.id!==CU.id) steps.push({ name:'HR Director', who:hrDir.id, status:'pending', date:null, note:'' });
  }

  const docNo=nextDocNo('PH-LR');
  const newReq = {
    id:'L-'+Date.now(), docNo, empId:CU.id, leaveType:type, from, to, days,
    reason, status:'pending', appliedDate:today(), approvedBy:null, approvedDate:null,
    handover, attachments:[], approvalSteps:steps
  };
  LEAVE_REQS.push(newReq);
  toast(`Leave request submitted · ${docNo}`, 'success');
  nav('my-leaves');
}

// ── Who's On Leave (Calendar) ──
function renderWhoOnLeave(){
  // Permission check
  if(!DASHBOARD_PERMS.whoOnLeave.roles.includes(CU.role)){
    return `<div class="ph"><div class="pt">Who's On Leave</div></div><div class="al al-r">🔒 You don't have permission to view this page. Contact HR Director.</div>`;
  }
  // Build month calendar (current month)
  const today = new Date();
  const year = today.getFullYear(), month = today.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0);
  const startWeek = firstDay.getDay();
  const days = [];
  for(let i=0;i<startWeek;i++) days.push(null);
  for(let d=1;d<=lastDay.getDate();d++) days.push(new Date(year,month,d));

  function leavesOnDay(date){
    if(!date) return [];
    const ds = date.toISOString().slice(0,10);
    return LEAVE_REQS.filter(l=>l.status==='approved' && l.from<=ds && l.to>=ds);
  }

  const monthName = today.toLocaleDateString('en-GB',{month:'long',year:'numeric'});

  return `
    <div class="ph">
      <div><div class="pt">Who's On Leave — ${monthName}</div><div class="ps">Team leave calendar (current month)</div></div>
      <div class="brow"><button class="btn" onclick="nav('apply-leave')">➕ Apply Leave</button></div>
    </div>

    <div class="card">
      <div class="ch"><div class="ct">${monthName} Leave Calendar</div></div>
      <div class="cb">
        <div class="cal-grid" style="margin-bottom:8px">
          ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div style="text-align:center;font-size:10px;font-weight:800;color:var(--t2);text-transform:uppercase;padding:8px 0">${d}</div>`).join('')}
        </div>
        <div class="cal-grid">
          ${days.map(d=>{
            if(!d) return '<div></div>';
            const isToday = d.toDateString()===new Date().toDateString();
            const isWknd = d.getDay()===0 || d.getDay()===6;
            const leaves = leavesOnDay(d);
            return `<div class="cal-day ${isToday?'today':''} ${isWknd?'weekend':''}">
              <div class="cal-day-num">${d.getDate()}</div>
              ${leaves.slice(0,3).map(l=>{
                const e=findEmp(l.empId);
                const lt=LEAVE_TYPES.find(t=>t.id===l.leaveType);
                const cls=l.leaveType==='annual'?'an':l.leaveType==='sick'?'sk':l.leaveType==='casual'?'cs':l.leaveType==='maternity'?'mt':'';
                return `<div class="cal-leave-pill ${cls}" title="${e.name} — ${lt.name}">${e.initials} ${lt.icon}</div>`;
              }).join('')}
              ${leaves.length>3?`<div style="font-size:9px;color:var(--t2);margin-top:2px">+${leaves.length-3} more</div>`:''}
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="ch"><div class="ct">Currently On Leave</div></div>
      <div class="cb">
        ${(()=>{
          const list = LEAVE_REQS.filter(l=>l.status==='approved' && new Date(l.from)<=new Date() && new Date(l.to)>=new Date());
          if(!list.length) return '<div style="text-align:center;color:var(--t3);padding:24px">Everyone is in today 🎉</div>';
          return list.map(l=>{
            const e=findEmp(l.empId);
            const lt=LEAVE_TYPES.find(t=>t.id===l.leaveType);
            return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
              ${avatar(e,'emp-avatar sm')}
              <div style="flex:1"><div style="font-weight:700;font-size:13px">${e.name}</div><div style="font-size:11px;color:var(--t2)">${e.position} · ${DEPTS[e.department].name}</div></div>
              <div style="text-align:right"><span class="bdg" style="background:${lt.color}22;color:${lt.color}">${lt.icon} ${lt.name}</span><div style="font-size:10px;color:var(--t2);margin-top:3px">Returns ${fmtDateShort(l.to)}</div></div>
            </div>`;
          }).join('');
        })()}
      </div>
    </div>
  `;
}

        <div class="ch">
          <div><div class="ct">Payment History</div><div class="cs">All payments where ${e.name.split(' ')[0]} is a beneficiary</div></div>

  if(tab === 'documents'){
    return `
      <div class="card">

  if(tab === 'inquiries'){
    const empInquiries = INQUIRIES.filter(i => i.empId === e.id).sort((a,b)=>b.submittedDate.localeCompare(a.submittedDate));
    return `
      <div class="card">
        <div class="ch"><div class="ct">Inquiries Raised</div></div>
        <div class="cb flush">
          <div class="tw"><table>
            <thead><tr><th>Doc #</th><th>Subject</th><th>Category</th><th>Priority</th><th>Submitted</th><th>Status</th><th></th></tr></thead>

                <td><span class="bdg b-sub">${i.category}</span></td>

  if(tab === 'emails'){
    const empEmails = EMAIL_LOG.filter(m => m.empId === e.id).sort((a,b)=>b.sentDate.localeCompare(a.sentDate));

            return `<div style="padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px">

  return '<div class="al al-i">Select a tab above</div>';

// ── Org Chart ──
function renderOrgChart(){
  // Build tree from supervisor relationships
  const tops = EMPLOYEES.filter(e=>!e.supervisor);
  function renderNode(emp, level){
    const reports = getSupervisees(emp.id);
    const cls = level===1?'lvl-1':level===2?'lvl-2':'lvl-3';
    return `<div class="org-child">
      <div class="org-node ${cls}" onclick="viewEmployee('${emp.id}')" style="cursor:pointer">
        ${avatar(emp,'emp-avatar sm')}
        <div class="org-name" style="margin-top:6px">${emp.name}</div>
        <div class="org-pos">${emp.position}</div>
        <div style="margin-top:4px"><span class="etag e-${emp.entity}">${emp.entity}</span></div>
      </div>
      ${reports.length?`<div class="org-children">${reports.map(r=>renderNode(r,level+1)).join('')}</div>`:''}
    </div>`;
  }
  return `
    <div class="ph">
      <div><div class="pt">Organisation Chart</div><div class="ps">Auto-generated from employee supervisor relationships</div></div>
    </div>
    <div class="card">
      <div class="cb" style="overflow-x:auto">
        <div class="org-tree">
          ${tops.length?tops.map(t=>renderNode(t,1)).join(''):'<div style="text-align:center;color:var(--t3);padding:40px">No org structure defined yet</div>'}
        </div>
      </div>
    </div>
  `;
}

// ── Birthdays ──
function renderBirthdays(){
  const upcoming = upcomingBirthdays(60);
  // Group by month
  const byMonth = {};
  upcoming.forEach(b=>{
    const m = b.date.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    if(!byMonth[m]) byMonth[m]=[];
    byMonth[m].push(b);
  });
  return `
    <div class="ph">
      <div><div class="pt">🎂 Upcoming Birthdays</div><div class="ps">Next 60 days</div></div>
    </div>
    ${Object.entries(byMonth).map(([m,list])=>`
      <div class="card">
        <div class="ch"><div class="ct">${m}</div><div class="cs">${list.length} birthday${list.length>1?'s':''}</div></div>
        <div class="cb">
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px">
            ${list.map(b=>`
              <div class="bday-card" onclick="viewEmployee('${b.emp.id}')" style="cursor:pointer">
                <div class="bday-emoji">${b.daysAway===0?'🎉':'🎂'}</div>
                <div class="bday-info">
                  <div class="bday-name">${b.emp.name}</div>

                  <div class="bday-when">${b.daysAway===0?'TODAY!':b.daysAway===1?'Tomorrow':`In ${b.daysAway} days`}</div>

            `).join('')}
          </div>
        </div>

    `).join('')||'<div class="al al-i">No upcoming birthdays in the next 60 days.</div>'}

}

function ackPolicy(id, method='read'){
  POLICY_ACKS.push({ policyId:id, empId:CU.id, date:today(), method });
  toast(`Policy ${method==='watched'?'watched':'acknowledged'} ✓`, 'success');
  renderMain(); renderSidebar();
}

function renderLeaveMgmt(){

    if(TAB===0) return LEAVE_REQS.filter(l=>l.status==='pending');
    if(TAB===1) return LEAVE_REQS.filter(l=>l.status==='approved');
    if(TAB===2) return LEAVE_REQS.filter(l=>l.status==='rejected');
    return LEAVE_REQS;
  })();
  const sorted = filtered.slice().sort((a,b)=>b.appliedDate.localeCompare(a.appliedDate));
  return `
    <div class="ph">
      <div><div class="pt">Leave Requests Management</div><div class="ps">Approve, reject, and review all leave requests</div></div>

    <div class="tabs">
      ${tabs.map((t,i)=>`<button class="tab${TAB===i?' on':''}" onclick="TAB=${i};renderMain()">${t} ${i===0?`(${LEAVE_REQS.filter(l=>l.status==='pending').length})`:''}</button>`).join('')}

              const e=findEmp(l.empId);

                if(s.status==='approved') return `<span style="color:var(--green)" title="${s.name}: approved">✓</span>`;
                if(s.status==='rejected') return `<span style="color:var(--red)">✗</span>`;

              }).join(' ');
              const canAct = l.approvalSteps.some(s=>s.status==='pending'&&s.who===CU.id);
              return `<tr>
                <td><span class="docno">${l.docNo}</span></td>
                <td><div style="display:flex;align-items:center;gap:8px">${avatar(e,'emp-avatar xs')}<div><div style="font-weight:600">${e.name}</div><div style="font-size:10px;color:var(--t2)">${DEPTS[e.department].name}</div></div></div></td>
                <td>${lt.icon} ${lt.name}</td>
                <td style="font-size:11px">${fmtDateShort(l.from)} → ${fmtDateShort(l.to)}</td>
                <td><strong>${l.days}</strong></td>
                <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--t2)">${htmlEsc(l.reason)}</td>
                <td>${leaveBadge(l.status)}</td>

function actLeave(id, decision){
  const l=LEAVE_REQS.find(x=>x.id===id); if(!l) return;
  const note=el('lvActionNote')?el('lvActionNote').value.trim():'';
  const myStep=l.approvalSteps.find(s=>s.status==='pending'&&s.who===CU.id);
  if(!myStep){ toast('Cannot act on this step','error'); return; }
  myStep.status=decision; myStep.date=today(); myStep.note=note;
  if(decision==='rejected'){
    l.status='rejected'; l.approvedBy=CU.id; l.approvedDate=today();
  } else {
    // Check if any pending steps remain
    const stillPending=l.approvalSteps.some(s=>s.status==='pending');
    if(!stillPending){
      l.status='approved'; l.approvedBy=CU.id; l.approvedDate=today();
      // Deduct balance
      const emp=findEmp(l.empId);
      if(emp.leaveBalance[l.leaveType]!==undefined) emp.leaveBalance[l.leaveType]-=l.days;
    }
  }
  closeModal();
  toast(`Leave ${decision} ✓`, decision==='approved'?'success':'warn');
  renderSidebar(); renderMain();
}

function cancelLeave(id){
  if(!confirm('Cancel this leave request?')) return;
  const l=LEAVE_REQS.find(x=>x.id===id); l.status='cancelled';
  closeModal(); toast('Leave request cancelled','info'); renderMain();
}

function saveEmpDoc(empId){
  const e = findEmp(empId);
  const type = el('ad_type').value;
  const name = el('ad_name').value.trim();
  const file = el('ad_file').value.trim() || `${type.toLowerCase().replace(/\s+/g,'-')}-${e.id}.pdf`;
  if(!name){ toast('Document name required','error'); return; }
  if(!e.documents) e.documents = [];
  const newDoc = {
    id: 'd-'+e.id+'-'+(Date.now()),
    type, name, file,
    date: today(),
    size: (Math.floor(Math.random()*900)+100) + ' KB'
  };
  e.documents.push(newDoc);
  logAudit('document.upload', newDoc.id, `Added ${type} document "${name}" to ${e.name}`);
  closeModal();
  toast('Document added','success');
  // Refresh the list inside the open employee form, if applicable
  if(el('empDocsList')) el('empDocsList').innerHTML = renderEmpDocsList(e);
  else renderMain();
}

function removeEmpDoc(empId, docId){
  if(!confirm('Remove this document?')) return;
  const e = findEmp(empId);
  e.documents = (e.documents||[]).filter(d => d.id !== docId);
  logAudit('document.remove', docId, `Removed document from ${e.name}`);
  toast('Document removed','info');
  if(el('empDocsList')) el('empDocsList').innerHTML = renderEmpDocsList(e);
  else renderMain();
}

function saveEmployee(id){
  const data = {
    name: el('ef_name').value.trim(),
    email: el('ef_email').value.trim(),
    dob: el('ef_dob').value,
    gender: el('ef_gender').value,
    phone: el('ef_phone').value,
    address: el('ef_addr').value,
    entity: el('ef_entity').value,
    department: el('ef_dept').value,
    position: el('ef_position').value.trim(),
    joinDate: el('ef_join').value,
    supervisor: el('ef_sup').value || null,
    role: el('ef_role').value,
    type: el('ef_type').value,
    salary: { basic:+el('ef_basic').value||0, allowances:+el('ef_allow').value||0, currency:el('ef_curr').value },
    bankAcc: { bank:el('ef_bank').value, accNo:el('ef_accno').value, branch:el('ef_branch').value },
    emergency: { name:el('ef_emname').value, relation:el('ef_emrel').value, phone:el('ef_emph').value }
  };
  if(!data.name||!data.email||!data.position){ toast('Fill all required fields','error'); return; }

  if(data.type==='foreign'){
    data.countryCode = el('ef_country').value;
    data.nationality = COUNTRY_FEES[data.countryCode]?.name || data.countryCode;
    data.foreign = {
      passportNo: el('ef_passport').value,
      passportExpiry: el('ef_pexp').value,
      visaExpiry: el('ef_vexp').value,
      workPermitExpiry: el('ef_wpexp').value,
      quotaExpiry: el('ef_qexp').value,
      medicalExpiry: el('ef_mexp').value,
      visaNo: '', workPermitNo: '', quotaSlot: ''
    };
  } else {
    data.nationality = 'Maldivian';
  }

  if(id){
    // edit
    const e=findEmp(id);
    Object.assign(e, data);
    toast('Employee updated','success');
  } else {
    // create
    const seq = Math.max(...EMPLOYEES.map(e=>parseInt(e.regNo.split('-').pop())||0))+1;
    data.id = data.email.split('@')[0].toLowerCase().replace(/[^a-z0-9]/g,'');
    data.regNo = `${ENTITIES[data.entity].regPrefix}-EMP-${new Date().getFullYear()}-${String(seq).padStart(REG_CONFIG.padding,'0')}`;
    data.initials = data.name.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase();
    data.pass = 'Welcome@2026';
    data.mustChangePwd = true;
    data.photo = null;
    data.signature = null;
    data.socials = { linkedin:'', facebook:'', twitter:'', instagram:'' };
    data.documents = [];
    // Default leave balances based on active leave types
    data.leaveBalance = {};
    LEAVE_TYPES.filter(lt=>lt.active).forEach(lt=>{ data.leaveBalance[lt.id]=lt.defaultEntitlement; });
    EMPLOYEES.push(data);
    toast(`Employee created: ${data.regNo}`,'success');
  }
  closeModal(); renderMain();
}

function renderForeignEmps(){
  const foreigns = EMPLOYEES.filter(e=>e.type==='foreign');
  const cutoff60=new Date(); cutoff60.setDate(cutoff60.getDate()+60);
  const cutoff30=new Date(); cutoff30.setDate(cutoff30.getDate()+30);

  // Calculate annual fees per country
  const byCountry = {};
  foreigns.forEach(e=>{
    if(!e.countryCode) return;
    if(!byCountry[e.countryCode]) byCountry[e.countryCode]={ count:0, totalAnnual:0 };
    byCountry[e.countryCode].count++;
    const fees = COUNTRY_FEES[e.countryCode];
    if(fees){
      const annual = fees.items.reduce((s,it)=>{
        const mult = it.freq==='monthly'?12:it.freq==='biennial'?0.5:it.freq==='oneoff'?0:1;
        return s+(it.amount*mult);
      },0);
      byCountry[e.countryCode].totalAnnual += annual;
    }
  });

  return `
    <div class="ph">
      <div><div class="pt">Foreign Employees</div><div class="ps">${foreigns.length} foreign employees · visa, permit, quota tracking</div></div>
      <div class="brow">
        <button class="btn btn-p" onclick="openAddEmployee()">➕ Add Foreign Employee</button>
        <button class="btn btn-g" onclick="exportForeignEmpsExcel()">⬇️ Export Excel</button>
      </div>
    </div>

    <div class="sgrid g4">
      <div class="sc bl"><div class="sl">Total Foreign</div><div class="sv">${foreigns.length}</div><div class="ss">across all entities</div><div class="si">🌍</div></div>
      <div class="sc am"><div class="sl">Expiring 60d</div><div class="sv">${expiringSoon()}</div><div class="ss">documents</div><div class="si">⚠️</div></div>
      <div class="sc rd"><div class="sl">Critical 30d</div><div class="sv">${(()=>{
        let n=0; foreigns.forEach(e=>{ if(!e.foreign) return;
          ['passportExpiry','visaExpiry','workPermitExpiry','medicalExpiry','quotaExpiry'].forEach(k=>{
            if(e.foreign[k]&&new Date(e.foreign[k])<=cutoff30) n++;
          }); });
        return n; })()}</div><div class="ss">very urgent</div><div class="si">🚨</div></div>
      <div class="sc gr"><div class="sl">Countries</div><div class="sv">${Object.keys(byCountry).length}</div><div class="ss">represented</div><div class="si">🗺️</div></div>
    </div>

    <div class="card">
      <div class="ch"><div class="ct">Country Breakdown</div></div>
      <div class="cb">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">
          ${Object.entries(byCountry).map(([cc,info])=>{
            const fees = COUNTRY_FEES[cc];
            return `<div style="padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2)">
              <div style="font-size:14px;font-weight:800">${fees.name}</div>
              <div style="font-size:11px;color:var(--t2);margin-top:2px">${info.count} employee${info.count>1?'s':''}</div>
              <div style="margin-top:10px;font-size:11px;color:var(--t2)">Annual cost ~${fees.currency} ${fmtInt(info.totalAnnual)}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="ch"><div class="ct">Foreign Employee Roster</div></div>
      <div class="cb flush">
        <div class="tw"><table>
          <thead><tr><th>Reg #</th><th>Employee</th><th>Country</th><th>Passport</th><th>Visa Exp</th><th>Work Permit</th><th>Quota</th><th>Medical</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${foreigns.map(e=>{
              const f=e.foreign||{};
              function dCell(d){ if(!d) return '<span style="color:var(--t3)">—</span>'; const dt=new Date(d); const days=Math.ceil((dt-new Date())/(1000*60*60*24)); const cls=days<14?'b-rej':days<60?'b-pap':'b-paid'; return `<span class="bdg ${cls}" title="${fmtDate(d)}">${days<0?'EXPIRED':days+'d'}</span>`; }
              const minDays = Math.min(...['visaExpiry','workPermitExpiry','medicalExpiry','quotaExpiry','passportExpiry'].map(k=>{ if(!f[k]) return 9999; return Math.ceil((new Date(f[k])-new Date())/(1000*60*60*24)); }));
              const overallStatus = minDays<0?'b-rej':minDays<14?'b-rej':minDays<60?'b-pap':'b-paid';
              return `<tr>
                <td><span class="docno" style="font-size:11px">${e.regNo}</span></td>
                <td><div style="display:flex;align-items:center;gap:6px">${avatar(e,'emp-avatar xs')}<span style="font-size:11px">${e.name}</span></div></td>
                <td><span class="bdg b-sub">${e.nationality}</span></td>
                <td>${f.passportNo||'—'}<br><small style="color:var(--t2)">${f.passportExpiry?fmtDateShort(f.passportExpiry):''}</small></td>
                <td>${dCell(f.visaExpiry)}</td>
                <td>${dCell(f.workPermitExpiry)}</td>
                <td>${dCell(f.quotaExpiry)}</td>
                <td>${dCell(f.medicalExpiry)}</td>
                <td><span class="bdg ${overallStatus}">${minDays<0?'Expired':minDays<14?'Critical':minDays<60?'Renew Soon':'OK'}</span></td>
                <td>
                  <button class="btn btn-xs" onclick="viewEmployee('${e.id}')">View</button>
                  ${minDays<60?`<button class="btn btn-xs btn-o" onclick="createVisaPayment('${e.id}')" title="Create payment request for visa/permit fees">💳 Pay Fees</button>`:''}
                </td>
              </tr>`;
            }).join('')||'<tr><td colspan="10" style="text-align:center;color:var(--t3);padding:24px">No foreign employees</td></tr>'}
          </tbody>
        </table></div>
      </div>
    </div>
  `;
}

  const period = periodArg || (el('pr_period') ? el('pr_period').value : null);
  const entity = entityArg || (el('pr_entity') ? el('pr_entity').value : null);
  if(!period || !entity){ toast('Period and entity are required', 'error'); return; }
  const emps = EMPLOYEES.filter(e => e.entity === entity && e.role !== 'sysadmin');
  // Validation warnings
  const warnings = [];
  // 1. Missing attendance for current month
  emps.forEach(e=>{
    const logs = ATTENDANCE.filter(a=>a.empId===e.id && a.date.startsWith(period));
    if(logs.filter(l=>l.signIn).length<5) warnings.push({sev:'warn', emp:e, msg:`Only ${logs.filter(l=>l.signIn).length} sign-ins recorded this month`});
  });
  // 2. Pending leaves
  emps.forEach(e=>{
    const pending=LEAVE_REQS.filter(l=>l.empId===e.id&&l.status==='pending'&&l.from.startsWith(period));
    if(pending.length) warnings.push({sev:'warn', emp:e, msg:`${pending.length} pending leave request(s) for this period`});
  });
  // 3. Bank details
  emps.forEach(e=>{
    if(!e.bankAcc.accNo) warnings.push({sev:'critical', emp:e, msg:'No bank account on file'});
  });
  // 4. Expired visa for foreign employees
  emps.filter(e=>e.type==='foreign').forEach(e=>{
    if(e.foreign&&e.foreign.workPermitExpiry&&new Date(e.foreign.workPermitExpiry)<new Date()){
      warnings.push({sev:'critical', emp:e, msg:'Work permit EXPIRED — cannot legally pay'});
    }
  });

  // Compute totals
  let totalGross=0, totalNet=0;
  const slips = emps.map(e=>{
    const slip = generatePayslip(e.id, period);
    totalGross += slip.gross;
    totalNet += slip.net;
    return slip;
  });

  closeModal();
  openModal(`
    <div class="mh"><div class="mt">Payroll Run — ${entity} · ${new Date(period+'-01').toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</div><button class="mc" onclick="closeModal()">×</button></div>
    <div class="mb">
      <div class="sgrid g3">
        <div class="sc bl"><div class="sl">Employees</div><div class="sv">${emps.length}</div></div>
        <div class="sc am"><div class="sl">Gross Total</div><div class="sv">${fmtInt(totalGross)}</div><div class="ss">${emps[0]?.salary.currency||'MVR'}</div></div>
        <div class="sc gr"><div class="sl">Net Total</div><div class="sv">${fmtInt(totalNet)}</div><div class="ss">to be paid</div></div>
      </div>

      ${warnings.length?`<div class="al al-w">⚠️ <strong>${warnings.length} validation warning${warnings.length>1?'s':''}</strong> — review before proceeding</div>
      <div style="max-height:200px;overflow-y:auto;background:var(--s2);border-radius:var(--r);padding:10px;margin-bottom:14px">
        ${warnings.map(w=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:11px"><span style="color:${w.sev==='critical'?'var(--red)':'var(--amber)'};font-size:14px">${w.sev==='critical'?'🚨':'⚠️'}</span><strong>${w.emp.name}</strong> — ${w.msg}</div>`).join('')}
      </div>`:'<div class="al al-s">✓ All pre-checks passed — payroll is ready</div>'}

      <div class="fsec">Payroll Detail (${emps.length} employees)</div>
      <div class="tw" style="max-height:280px;overflow-y:auto"><table>
        <thead><tr><th>Employee</th><th>Basic</th><th>Allowance</th><th>Gross</th><th>Pension</th><th>Tax</th><th>Net</th></tr></thead>
        <tbody>
          ${slips.map(s=>{ const e=findEmp(s.empId); return `<tr>
            <td style="font-size:11px">${e.name}<br><small style="color:var(--t2)">${e.position}</small></td>
            <td><span class="mono">${fmt(s.basic)}</span></td>
            <td><span class="mono">${fmt(s.allowances)}</span></td>
            <td><span class="mono"><strong>${fmt(s.gross)}</strong></span></td>
            <td><span class="mono" style="color:var(--red)">${fmt(s.pension)}</span></td>

          </tr>`; }).join('')}
        </tbody>
      </table></div>
    </div>
    <div class="mf">

function finalizeHandoff(entity, period, ref, totalGross, totalNet, count){
  const id = `PR-${period}-${ENTITIES[entity].regPrefix}`;
  // Generate the inter-department doc reference (this is what PayFlow will see in its 'ref' field)
  const docRef = nextDocNo('PR-HR');
  const monthName = new Date(period+'-01').toLocaleDateString('en-GB',{month:'long',year:'numeric'});

  // Update or create the payroll run record
  const existing = PAYROLL_RUNS.find(r => r.id === id);
  if(existing){
    existing.status = 'paid';
    existing.runDate = today();
    existing.totalGross = totalGross;
    existing.totalNet = totalNet;
    existing.employeeCount = count;
    existing.paidViaPayflow = true;
    existing.payflowRef = ref;       // PayFlow PV (e.g. PS/BML/MVR/26/045)
    existing.docRef = docRef;        // our HR inter-dept ref (e.g. PR-HR-2026-0009)
  } else {
    PAYROLL_RUNS.push({
      id, period, entity,
      status:'paid', runDate:today(), totalGross, totalNet, employeeCount:count,
      paidViaPayflow:true, payflowRef:ref, docRef
    });
  }

  // ALSO create a unified Payment Request record (this is the master register of all HR→PayFlow payments)
  const empRefs = EMPLOYEES.filter(e => e.entity === entity && e.role !== 'sysadmin').map(e => e.id);
  PAYMENT_REQUESTS.push({
    id:'pmt-'+Date.now(), docRef, kind:'payroll',
    subject:`${monthName} Payroll — ${entity}`,
    entity, amount:totalNet, currency:'MVR',
    beneficiary:`${count} ${entity} employees (bulk)`,
    beneficiaryType:'multi', beneficiaryRefs:empRefs,
    requestDate:today(), requestedBy:CU.id,
    relatedDoc:id, purpose:`Monthly payroll disbursement for ${entity} · ${monthName}`,
    status:'paid', sentToPayflow:true, payflowSentDate:today(),
    pvNo:ref, payflowStatus:'paid', payflowPaidDate:today(),
    notes:`${count} employees · auto-generated from payroll run`
  });

  logAudit('payroll.run', id, `Payroll completed · ${count} employees · ${entity} ${period} · Net ${fmt(totalNet)} · HR ref ${docRef} · PayFlow PV ${ref}`);
  closeModal();
  toast(`Payroll handed off to PayFlow · HR ref ${docRef} → PV ${ref}`, 'success');
  renderMain();
}

function applyLetterTemplate(){
  const tplId = el('ltKind').value;
  const empId = el('ltEmp').value;
  const purpose = el('ltPurpose').value || '[purpose]';
  const emp = findEmp(empId);
  if(!emp) return;
  if(tplId === 'custom'){
    el('ltTitle').value = '';
    el('ltContent').value = '';
    return;
  }
  const tpl = LETTER_TEMPLATES.find(t => t.id === tplId); if(!tpl) return;
  el('ltTitle').value = tpl.title;
  el('ltContent').value = fillPlaceholders(tpl.body, emp, { purpose });
}

function saveLetter(){
  const tplId = el('ltKind').value;
  const tpl = LETTER_TEMPLATES.find(t => t.id === tplId);
  const kind = tpl ? tpl.kind : 'custom';
  const empId = el('ltEmp').value;
  const title = el('ltTitle').value.trim();
  const purpose = el('ltPurpose').value.trim();
  const content = el('ltContent').value.trim();
  if(!title || !content || !purpose){ toast('Title, purpose, and body are required','error'); return; }
  const docNo = nextDocNo('PH-LTR');
  const newDoc = { id:docNo, docNo, kind, title, empId, purpose, content,
    issuedDate:today(), issuedBy:CU.id, status:'issued' };
  DOCUMENTS.push(newDoc);
  const emp = findEmp(empId);
  logAudit('letter.issue', docNo, `Issued ${tpl?tpl.name:'custom letter'} to ${emp.name}`);
  closeModal();
  toast(`Letter issued · ${docNo}`,'success');
  // Offer to email
  setTimeout(()=>{
    if(confirm(`Letter ${docNo} issued. Email it to ${emp.name} now?`)){
      emailDocument('letter', docNo);
    } else {
      renderMain();
    }
  }, 200);
}

function loadAppTemplate(){
  const tplId=el('evTpl').value;
  const tpl=APPRAISAL_TEMPLATES.find(t=>t.id===tplId);
  if(!tpl) return;
  el('evCriteria').innerHTML = `<div class="fsec">Rating Criteria · ${tpl.name}</div>` + tpl.criteria.map(c=>`
    <div class="appraisal-criterion">
      <div class="ac-name">${c.name} <span style="color:var(--t3);font-weight:400;font-size:11px">(${c.weight}%)</span></div>
      <div class="ac-desc">${c.desc}</div>
      <div class="ac-score">
        <div class="rating" data-criterion="${c.id}">
          ${[1,2,3,4,5].map(n=>`<span class="rating-star" onclick="setRating('${c.id}',${n})" data-n="${n}">★</span>`).join('')}
        </div>
        <span style="font-size:11px;color:var(--t2);margin-left:6px">Click to rate</span>
      </div>
    </div>
  `).join('');
}

let _evScores={};
function setRating(critId, n){
  _evScores[critId]=n;
  document.querySelectorAll(`[data-criterion="${critId}"] .rating-star`).forEach(s=>{
    s.classList.toggle('on', +s.dataset.n<=n);
  });
}

function saveEvaluation(){
  const empId=el('evEmp').value, tplId=el('evTpl').value, period=el('evPeriod').value;
  const tpl=APPRAISAL_TEMPLATES.find(t=>t.id===tplId);
  const scores={};
  let overall=0, totalWeight=0;
  tpl.criteria.forEach(c=>{
    const s=_evScores[c.id]||0;
    scores[c.id]=s;
    overall += s*c.weight;
    totalWeight += c.weight;
  });
  overall = overall/totalWeight;
  const docNo=nextDocNo('PH-EVL');
  EVALUATIONS.push({
    id:'EV-'+Date.now(), docNo, empId, templateId:tplId, period, evaluator:CU.id,
    date:today(), status:'completed', overallScore:overall,
    comments:el('evComments').value, scores
  });
  _evScores={};
  closeModal(); toast(`Evaluation saved · ${docNo}`,'success'); renderMain();
}

  const ev=EVALUATIONS.find(x=>x.id===id); if(!ev) return;

  openModal(`

        <div><div style="font-size:10px;color:var(--t2);text-transform:uppercase;font-weight:700">Overall Score</div><div style="font-size:32px;font-weight:800;color:${ev.overallScore>=4?'var(--green)':ev.overallScore>=3?'var(--amber)':'var(--red)'};margin-top:4px">${ev.overallScore.toFixed(2)} <span style="font-size:14px;color:var(--t3)">/ 5</span></div></div>
        <div><div style="font-size:10px;color:var(--t2);text-transform:uppercase;font-weight:700">Period</div><div style="margin-top:4px">${ev.period}</div></div>
        <div><div style="font-size:10px;color:var(--t2);text-transform:uppercase;font-weight:700">Evaluated By</div><div style="margin-top:4px">${evor?evor.name:'—'} · ${fmtDate(ev.date)}</div></div>
      </div>
      <div class="fsec">Criteria Scores · ${tpl?tpl.name:''}</div>
      ${tpl?tpl.criteria.map(c=>{
        const score = ev.scores[c.id]||0;
        return `<div class="appraisal-criterion">
          <div class="ac-name">${c.name} <span style="color:var(--t3);font-weight:400;font-size:11px">(${c.weight}%)</span></div>

          <div class="ac-score">

function saveLeaveType(idx){
  const data = {
    id: el('ltf_id').value.trim(),
    name: el('ltf_name').value.trim(),

    needsDoc: el('ltf_doc').value==='true',

  LEAVE_TYPES[idx].active = !LEAVE_TYPES[idx].active;

  renderMain();
}

function saveRegConfig(){
  REG_CONFIG.format = el('rcf_format').value;
  REG_CONFIG.padding = +el('rcf_pad').value;

function pmtBadge(status, payflowStatus){
  const m = {
    'draft':            ['b-draft', 'Draft'],
    'pending-approval': ['b-pap',   'Pending Approval'],
    'approved':         ['b-app',   'Approved'],
    'rejected':         ['b-rej',   'Rejected'],
    'sent':             ['b-sub',   'Sent to PayFlow'],
    'paid':             ['b-paid',  'Paid'],
    'cancelled':        ['b-draft', 'Cancelled']
  };
  const [cls, lbl] = m[status] || ['b-draft', status];
  let html = `<span class="bdg ${cls}"><span class="bd"></span>${lbl}</span>`;
  if(payflowStatus && status === 'sent'){
    html += ` <span class="bdg b-pap" style="margin-left:3px;font-size:9px">PayFlow: ${payflowStatus}</span>`;
  }
  return html;
}

function savePaymentRequest(action){
  const kind = el('pmt_kind').value;
  const t = PAYMENT_TYPES[kind];
  const entity = el('pmt_entity').value;
  const btype = el('pmt_btype').value;
  const benValue = el('pmt_ben').value;
  const subject = el('pmt_subject').value.trim();
  const amount = +el('pmt_amount').value || 0;
  const currency = el('pmt_curr').value;
  const related = el('pmt_related').value.trim();
  const purpose = el('pmt_purpose').value.trim();
  const notes = el('pmt_notes').value.trim();

  if(!subject || !purpose || amount <= 0){ toast('Fill all required fields and enter a valid amount','error'); return; }

  // Generate the inter-dept doc reference
  const docRef = nextDocNo(t.refPrefix);
  let beneficiary, beneficiaryRefs;
  if(btype === 'single'){
    const emp = findEmp(benValue);
    beneficiary = emp ? emp.name : benValue;
    beneficiaryRefs = [benValue];
  } else {
    beneficiary = benValue;
    beneficiaryRefs = [];
  }

  const newReq = {
    id: 'pmt-' + Date.now(),
    docRef, kind, subject, entity, amount, currency,
    beneficiary, beneficiaryType:btype, beneficiaryRefs,
    requestDate: today(), requestedBy: CU.id,
    relatedDoc: related, purpose, notes,
    status: action === 'send' ? 'sent' : 'draft',
    sentToPayflow: action === 'send',
    payflowSentDate: action === 'send' ? today() : null,
    pvNo: null, payflowStatus: null, payflowPaidDate: null
  };

  // If sending, assign a simulated PayFlow PV number too
  if(action === 'send'){
    const yy = today().slice(2,4);
    const seq = String(Math.floor(Math.random()*900)+100);
    newReq.pvNo = `${ENTITIES[entity].regPrefix}/BML/${currency}/${yy}/${seq}`;
    newReq.payflowStatus = 'pending-approval';
  }

  PAYMENT_REQUESTS.push(newReq);
  logAudit('payment.create', docRef, `Created ${t.label} for ${beneficiary} · ${currency} ${fmt(amount)}${action==='send'?` · sent to PayFlow as ${newReq.pvNo}`:' · saved as draft'}`);
  closeModal();
  toast(`Payment request ${docRef} ${action==='send'?'sent to PayFlow':'saved as draft'}`, 'success');
  renderMain();
  renderSidebar();
}

function confirmPaymentSend(id, pvNo){
  const p = PAYMENT_REQUESTS.find(x => x.id === id); if(!p) return;
  p.status = 'sent';
  p.sentToPayflow = true;
  p.payflowSentDate = today();
  p.pvNo = pvNo;
  p.payflowStatus = 'pending-approval';
  logAudit('payment.send', p.docRef, `Sent ${PAYMENT_TYPES[p.kind].label} to PayFlow · PV ${pvNo} · ${p.currency} ${fmt(p.amount)}`);
  closeModal();
  toast(`Sent to PayFlow · PV ${pvNo}`, 'success');
  renderMain();
  renderSidebar();
}

function cancelPaymentRequest(id){
  if(!confirm('Cancel this payment request? It cannot be undone.')) return;
  const p = PAYMENT_REQUESTS.find(x => x.id === id); if(!p) return;
  p.status = 'cancelled';
  logAudit('payment.cancel', p.docRef, `Cancelled payment request`);
  closeModal();
  toast('Payment request cancelled','info');
  renderMain();
}

function pdfPaymentRequest(id){
  const p = PAYMENT_REQUESTS.find(x => x.id === id); if(!p) return;
  const { jsPDF } = window.jspdf;
  const t = PAYMENT_TYPES[p.kind];
  const requester = findEmp(p.requestedBy);
  const doc = new jsPDF();
  pdfHeader(doc, p.entity, 'PAYMENT REQUEST', p.docRef);

  let y = 55;
  doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(`${t.icon} ${t.label}`, 14, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90);
  y += 5; doc.text(p.subject, 14, y);

  // Reference box
  y += 10;
  doc.setFillColor(238, 242, 252);
  doc.rect(14, y, 182, 18, 'F');
  doc.setTextColor(13, 45, 110); doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('HR INTER-DEPT REFERENCE', 18, y+6);
  doc.setFont('courier','bold'); doc.setFontSize(13);
  doc.text(p.docRef, 18, y+13);
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('PAYFLOW PV', 110, y+6);
  doc.setFont('courier','bold'); doc.setFontSize(13);
  doc.text(p.pvNo || '— not sent —', 110, y+13);

  // Details table
  doc.autoTable({
    startY: y + 24,
    body: [
      ['Entity', `${p.entity} — ${ENTITIES[p.entity].name}`],
      ['Payment Type', `${t.label} (${t.paymentType})`],
      ['Ledger Account', `${t.ledger} — ${t.ledgerName}`],
      ['Method', t.method],
      ['Amount', `${p.currency} ${fmt(p.amount)}`],
      ['Beneficiary', p.beneficiary],
      ['Requested By', `${requester?requester.name:p.requestedBy} on ${fmtDate(p.requestDate)}`],
      ['Status', p.status.toUpperCase() + (p.payflowStatus?` (PayFlow: ${p.payflowStatus})`:'')],
      ['Related Document', p.relatedDoc || '—']
    ],
    theme:'grid',
    columnStyles: { 0: { fontStyle:'bold', cellWidth:55, fillColor:[244,246,249] }, 1: { cellWidth:127 } },
    styles: { fontSize:10, cellPadding:3 }
  });

  // Purpose
  let fy = doc.lastAutoTable.finalY + 8;
  doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(28,32,48);
  doc.text('PURPOSE', 14, fy);
  doc.setFont('helvetica','normal');
  fy += 5;
  const lines = doc.splitTextToSize(p.purpose, 182);
  doc.text(lines, 14, fy);
  fy += lines.length * 5;

  if(p.notes){
    fy += 5;
    doc.setFont('helvetica','bold');
    doc.text('INTERNAL NOTES', 14, fy);
    doc.setFont('helvetica','normal');
    fy += 5;
    const nl = doc.splitTextToSize(p.notes, 182);
    doc.text(nl, 14, fy);
    fy += nl.length * 5;
  }

  // Signature block
  fy += 18;
  doc.setLineWidth(0.3); doc.line(14, fy, 80, fy); doc.line(115, fy, 181, fy);
  fy += 4;
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('Prepared By', 14, fy); doc.text('Approved By', 115, fy);
  fy += 4;
  doc.setFont('helvetica','normal'); doc.setTextColor(90);
  doc.text(requester ? requester.name : '—', 14, fy);
  doc.text('HR Director', 115, fy);

  pdfFooter(doc);
  doc.save(`PaymentRequest_${p.docRef}.pdf`);
  toast('Payment request downloaded', 'success');
  logAudit('document.download', p.docRef, `Downloaded payment request PDF`);
}

function createVisaPayment(empId){
  const e = findEmp(empId); if(!e) return;
  if(!e.foreign){ toast('Not a foreign employee','error'); return; }
  const fees = COUNTRY_FEES[e.countryCode];
  if(!fees){ toast(`No fee structure for ${e.countryCode}`,'error'); return; }
  // Calculate total annual fees
  const totalAnnual = fees.items.reduce((s,it) => {
    const mult = it.freq==='monthly'?12 : it.freq==='biennial'?0.5 : it.freq==='oneoff'?0 : 1;
    return s + (it.amount * mult);
  }, 0);

  newPaymentRequest();
  setTimeout(() => {
    if(el('pmt_kind')) el('pmt_kind').value = 'visa';
    if(el('pmt_entity')) el('pmt_entity').value = e.entity;
    if(el('pmt_btype')) { el('pmt_btype').value = 'govt'; updateBeneficiaryField(); }
    setTimeout(() => {
      if(el('pmt_ben')) el('pmt_ben').value = `${fees.name} Immigration / Government Authority`;
      if(el('pmt_subject')) el('pmt_subject').value = `Visa & Permit Renewal — ${e.name}`;
      if(el('pmt_amount')) el('pmt_amount').value = totalAnnual;
      if(el('pmt_curr')) el('pmt_curr').value = fees.currency;
      if(el('pmt_purpose')){
        const breakdown = fees.items.map(it => `${it.label}: ${fees.currency} ${fmt(it.amount)} (${it.freq})`).join('\n');
        el('pmt_purpose').value = `Visa, work permit, quota, and medical insurance renewal for ${e.name} (${e.regNo}) · ${e.nationality} · expires ${fmtDate(e.foreign.workPermitExpiry)}\n\nFee breakdown:\n${breakdown}`;
      }
      if(el('pmt_notes')) el('pmt_notes').value = `Foreign employee renewal · Country: ${fees.name} · Annual estimated total: ${fees.currency} ${fmt(totalAnnual)}`;
      updatePmtPreview();
    }, 50);
  }, 50);
}

function newPmtForEmp(empId){
  const e = findEmp(empId); if(!e) return;
  newPaymentRequest();
  setTimeout(() => {
    if(el('pmt_entity')) el('pmt_entity').value = e.entity;
    if(el('pmt_btype')) { el('pmt_btype').value = 'single'; updateBeneficiaryField(); }
    setTimeout(() => {
      if(el('pmt_ben')) el('pmt_ben').value = e.id;
      updatePmtPreview();
    }, 50);
  }, 50);
}

function saveLetterTemplate(idx){
  const data = {
    id: el('tpl_id').value.trim(),
    kind: el('tpl_kind').value,
    name: el('tpl_name').value.trim(),
    title: el('tpl_title').value.trim(),
    body: el('tpl_body').value,
    active: idx===null?true:LETTER_TEMPLATES[idx].active
  };
  if(!data.id||!data.name||!data.title||!data.body){ toast('Fill all required fields','error'); return; }
  if(idx===null) LETTER_TEMPLATES.push(data); else LETTER_TEMPLATES[idx]=data;
  logAudit('config.update','LETTER_TEMPLATE.'+data.id,`${idx===null?'Created':'Updated'} letter template "${data.name}"`);
  closeModal(); toast('Template saved','success'); renderMain();
}

function toggleLetterTemplate(idx){
  LETTER_TEMPLATES[idx].active = !LETTER_TEMPLATES[idx].active;
  logAudit('config.update','LETTER_TEMPLATE.'+LETTER_TEMPLATES[idx].id,`${LETTER_TEMPLATES[idx].active?'Enabled':'Disabled'} template`);
  toast(`Template ${LETTER_TEMPLATES[idx].active?'enabled':'disabled'}`,'success');
  renderMain();
}

function exportFullBackup(){
  const backup = {
    version:'2.0',
    exportDate: new Date().toISOString(),
    entities: ENTITIES, depts: DEPTS,
    employees: EMPLOYEES, attendance: ATTENDANCE, leaves: LEAVE_REQS,
    inquiries: INQUIRIES, payroll: PAYROLL_RUNS, documents: DOCUMENTS,
    evaluations: EVALUATIONS, leaveTypes: LEAVE_TYPES, letterTemplates: LETTER_TEMPLATES,
    appraisalTemplates: APPRAISAL_TEMPLATES, approvalWorkflows: APPROVAL_WORKFLOWS,
    countryFees: COUNTRY_FEES, regConfig: REG_CONFIG, dashboardPerms: DASHBOARD_PERMS,
    policies: POLICIES, policyAcks: POLICY_ACKS, sequences: SEQUENCES,
    auditLog: AUDIT_LOG, emailLog: EMAIL_LOG
  };
  const blob = new Blob([JSON.stringify(backup,null,2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `peopleflow-backup-${today()}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('Backup downloaded','success');
  logAudit('backup.export','full',`Full system backup downloaded`);
}

function exportAllPayslipsExcel(){
  const period = today().slice(0,7);
  const rows = EMPLOYEES.filter(e=>e.role!=='sysadmin').map(e=>{
    const s = generatePayslip(e.id, period);
    return {
      'Reg No': e.regNo, 'Name': e.name, 'Entity': e.entity, 'Position': e.position,
      'Bank': e.bankAcc.bank, 'Account': e.bankAcc.accNo,
      'Basic': s.basic, 'Allowances': s.allowances, 'Gross': s.gross,
      'Pension': s.pension, 'Tax': s.tax, 'Net': s.net, 'Currency': e.salary.currency
    };
  });
  exportExcel(rows, `Payslips_${period}`, `AllPayslips_${period}.xlsx`);
}
